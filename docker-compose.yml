services:
  # Nginx - Reverse Proxy
  nginx:
    image: nginx:1.24-alpine
    container_name: price-monitor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro # Para HTTPS en producción
    depends_on:
      - frontend
      - backend-express
      - backend-go
    networks:
      - price-monitor-network
    restart: unless-stopped

  # Frontend - Next.js
  user_app:
    build:
      context: ./user_app
      dockerfile: Dockerfile.dev
    container_name: price-monitor-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./user_app:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - ms_registry
      - ms_scraper
    networks:
      - price-monitor-network
    restart: unless-stopped
  ms_registry:
    build:
      context: ./ms_registry
      dockerfile: Dockerfile.dev
    container_name: price-monitor-registry
    ports:
      - "3001:3001"
    volumes:
      - ./ms_registry:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://user:password@postgres:5432/price_monitor
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - price-monitor-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  ms_scraper:
    build:
      context: ./ms_scraper
      dockerfile: Dockerfile.dev
    container_name: price-monitor-scraper
    ports:
      - "8080:8080"
    volumes:
      - ./ms_scraper:/app
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://user:password@postgres:5432/price_monitor
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - price-monitor-network
    restart: unless-stopped
  postgres:
    image: timescale/timescaledb:2.11.0-pg15
    container_name: price-monitor-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=price_monitor
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d price_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - price-monitor-network
    restart: unless-stopped
  redis:
    image: redis:7.2-alpine
    container_name: price-monitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - price-monitor-network
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: price-monitor-rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - price-monitor-network
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: price-monitor-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - postgres
    networks:
      - price-monitor-network
    restart: unless-stopped
    profiles:
      - dev-tools
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: price-monitor-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - price-monitor-network
    restart: unless-stopped
    profiles:
      - dev-tools

networks:
  price-monitor-network:
    driver: bridge
    name: price-monitor-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
